name: Keep API and DB awake

on:
  schedule:
    # Every 10 minutes — comfortably under Render's 15-minute free-tier
    # sleep timer. /health also runs SELECT 1 against Supabase, so this
    # ping keeps both the API instance and the database warm.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health endpoint
        run: |
          curl --fail --silent --show-error --max-time 60 \
            https://ikaystores-api.onrender.com/api/v1/health
