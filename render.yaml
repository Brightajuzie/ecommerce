services:
  - type: web
    name: ikaystores-api
    runtime: node
    plan: free
    region: oregon
    # `corepack enable && corepack prepare pnpm@<version> --activate` runs first
    # so Corepack activates the exact pnpm version pinned in package.json's
    # "packageManager" field before anything else executes. Without this,
    # Render's build image falls through to its preinstalled Yarn 1.x, and a
    # long-standing Corepack bug (nodejs/corepack#706) then reports a garbled
    # "packageManager": "yarn@pnpm@11.9.0" mismatch error instead of the real
    # "pnpm isn't active yet" cause.
    buildCommand: corepack enable && corepack prepare pnpm@11.9.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @ikaystores/shared build && pnpm --filter api exec prisma generate && pnpm --filter api build
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://ikaystores-api.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: TRUST_PROXY
        value: "true"
      - key: SWAGGER_ENABLED
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: FLW_PUBLIC_KEY
        sync: false
      - key: FLW_SECRET_KEY
        sync: false
      - key: FLW_ENCRYPTION_KEY
        sync: false
      - key: FLW_WEBHOOK_HASH
        sync: false
      - key: OPAY_MERCHANT_ID
        sync: false
      - key: OPAY_PUBLIC_KEY
        sync: false
      - key: OPAY_SECRET_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: DOJAH_APP_ID
        sync: false
      - key: DOJAH_SECRET_KEY
        sync: false
      - key: DOJAH_ENVIRONMENT
        value: production
