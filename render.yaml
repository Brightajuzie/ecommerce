services:
  - type: web
    name: ikaystores-api
    runtime: node
    plan: free
    region: oregon
    # Every step is invoked as `corepack pnpm@<version> ...` rather than a
    # bare `pnpm ...` — this meta-command form runs the pinned version
    # directly out of Corepack's own cache and never touches a bare `pnpm`
    # command, so it needs no shim installed anywhere. `corepack enable` /
    # `corepack prepare --activate` (an earlier attempt at this fix) install
    # shims into the global bin dir instead, which fails with
    # `EROFS: read-only file system, unlink '/usr/bin/pnpm'` on Render's
    # build image. Without pinning the version this way, the build image's
    # preinstalled Yarn 1.x runs instead, and a long-standing Corepack bug
    # (nodejs/corepack#706) garbles the resulting error into a nonsensical
    # "packageManager": "yarn@pnpm@11.9.0" mismatch report.
    buildCommand: corepack pnpm@11.9.0 install --frozen-lockfile && corepack pnpm@11.9.0 --filter @ikaystores/shared build && corepack pnpm@11.9.0 --filter api exec prisma generate && corepack pnpm@11.9.0 --filter api build
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://ikaystores-api.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: TRUST_PROXY
        value: "true"
      - key: SWAGGER_ENABLED
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: FLW_PUBLIC_KEY
        sync: false
      - key: FLW_SECRET_KEY
        sync: false
      - key: FLW_ENCRYPTION_KEY
        sync: false
      - key: FLW_WEBHOOK_HASH
        sync: false
      - key: OPAY_MERCHANT_ID
        sync: false
      - key: OPAY_PUBLIC_KEY
        sync: false
      - key: OPAY_SECRET_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: DOJAH_APP_ID
        sync: false
      - key: DOJAH_SECRET_KEY
        sync: false
      - key: DOJAH_ENVIRONMENT
        value: production
