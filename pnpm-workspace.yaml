packages:
  - "apps/*"
  - "packages/*"
minimumReleaseAge: 0
# multer is a transitive dep of @nestjs/platform-express — 2.1.1 (what it
# currently resolves to) has two known DoS advisories (deeply-nested field
# names; incomplete cleanup of aborted uploads), both fixed in 2.2.0. This
# directly covers our own POST /uploads/image endpoint, so it's worth
# pinning ahead of platform-express's own next bump rather than waiting.
overrides:
  multer: ">=2.2.0"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  prisma: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.3'
  - '@expo/fingerprint@0.20.1'
  - '@expo/inline-modules@0.1.1'
  - '@expo/local-build-cache-provider@57.0.1'
  - '@expo/metro-config@57.0.2'
  - '@expo/prebuild-config@57.0.3'
  - '@expo/router-server@57.0.1'
  - babel-preset-expo@57.0.1
  - expo-asset@57.0.2
  - expo-constants@57.0.2
  - expo-modules-autolinking@57.0.3
  - expo-modules-core@57.0.1
  - expo@57.0.1
